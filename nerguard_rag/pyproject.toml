[project]
name = "nerguard-rag"
version = "0.1.0"
description = "RAG-optimized PII redaction with typed placeholders — built on NerGuard"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Gabriele Durante"}
]
keywords = [
    "pii", "rag", "nlp", "privacy", "gdpr", "redaction",
    "named-entity-recognition", "llm", "retrieval-augmented-generation"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/exdsgift/NerGuard"
"HuggingFace Model" = "https://huggingface.co/exdsgift/NerGuard-0.3B"
"Bug Tracker" = "https://github.com/exdsgift/NerGuard/issues"

[project.scripts]
nerguard-rag = "nerguard_rag.cli:main"

dependencies = [
    # PyPI dependency for distributed installs.
    # During local dev, uv.sources overrides this to the editable local copy.
    "nerguard>=1.0.0",
]

[tool.uv.sources]
nerguard = { path = "..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
